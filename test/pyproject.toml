[project]
name = "mailkube-smtp-relay-tests"
version = "0.0.0"
description = "Integration test harness for the mailkube/smtp-relay container."
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0",
  "cryptography>=44.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
  "slow: takes tens of seconds (connection reuse and drain tests)",
]
# The harness drives real containers, so a hung docker command must not hang CI.
timeout = 600

[tool.ruff]
line-length = 120
target-version = "py312"
