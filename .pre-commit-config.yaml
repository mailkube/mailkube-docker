# Run `pre-commit install && pre-commit install --hook-type commit-msg` after cloning.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^examples/kubernetes/  # multi-doc manifests with templated fields
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: ^rootfs/.*\.sh$
        # See .rules/ENTRYPOINT.md: the dash dialect is what suppresses SC3040
        # for the pipefail this tree legitimately uses on BusyBox ash.
        args: [-x, --shell=dash]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -sr, -d]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--config, .hadolint.yaml]

  # Language-agnostic DRY gate, identical config in every mailkube repo.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (copy-paste detector)
        entry: npx --yes jscpd@4 --config .jscpd.json .
        language: system
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
