# Cyrus SASL configuration for the Postfix SMTP *server* (inbound auth).
#
# Static and baked into the image so /etc can stay read-only. Only the password
# database itself is written at runtime, and it lives on tmpfs under /run so
# credentials never touch a disk-backed layer.
#
# This file is inert unless RELAY_AUTH_USERS or RELAY_AUTH_USERS_FILE is set:
# smtpd_sasl_auth_enable defaults to no and is turned on by the entrypoint.
pwcheck_method: auxprop
auxprop_plugin: sasldb
sasldb_path: /run/postfix/sasldb2
mech_list: PLAIN LOGIN
