name: Security

# Weekly scan of the PUBLISHED image. CI scans what a pull request builds; this
# catches a CVE disclosed against an image already in customers' clusters.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan of :latest
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mailkube/smtp-relay:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "1"

      - name: Open an issue on findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('trivy.txt') ? fs.readFileSync('trivy.txt', 'utf8') : 'Trivy produced no report.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: fixable CRITICAL/HIGH findings in mailkube/smtp-relay:latest`,
              labels: ['security'],
              body: "Weekly scan of the published image found fixable vulnerabilities.\n\nRebuild against a current base image digest.\n\n```\n" + body.slice(0, 60000) + "\n```",
            });
