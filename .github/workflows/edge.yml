name: Edge

# Publishes :edge on every merge to main, for traceability between releases.
#
# Deliberately a SEPARATE workflow file rather than a job inside ci.yml. In a
# called workflow the `github` context belongs to the CALLER, so an
# event-gated edge push living in ci.yml would also fire during release.yml's
# `ci-gate` job, where no secrets are passed. docker/login-action would then
# receive an empty token and every release would be blocked.
on:
  push:
    branches: [main]

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mailkube/smtp-relay:edge
          build-args: |
            VERSION=edge
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
