name: Edge

# Publishes :edge on every merge to main, for traceability between releases.
#
# Deliberately a SEPARATE workflow file rather than a job inside ci.yml. In a
# called workflow the `github` context belongs to the CALLER, so an
# event-gated edge push living in ci.yml would also fire during release.yml's
# `ci-gate` job. The push would then run without `packages: write` and fail,
# blocking every release.
on:
  push:
    branches: [main]

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io. Not granted by default.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # No registry secret exists. GHCR accepts the workflow's own token, which
      # is why the move off Docker Hub removed two repository secrets.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mailkube/smtp-relay:edge
          build-args: |
            VERSION=edge
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
