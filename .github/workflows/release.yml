name: Release

# Conventional-Commits-driven release: tag, GitHub Release, then a multi-arch
# push to GitHub Container Registry.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-gate:
    # Release only proceeds if the full gated CI (test + dry + docs) is green.
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the tag and create the GitHub Release
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # A tag pushed with GITHUB_TOKEN does NOT trigger other workflows (GitHub
      # loop prevention), so a separate `on: push: tags` publish job would never
      # fire. Comparing the newest tag before and after is what lets `publish`
      # run in the same workflow, with no extra plugin and no PAT.
      - name: Capture tag before release
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # No @semantic-release/changelog or /git plugin on purpose: semantic-release
      # creates the TAG and the GitHub Release and never writes to the branch.
      # A ruleset protecting `main` would reject a bot commit, and
      # github-actions[bot] cannot be added to a ruleset bypass list. Release
      # notes live on the GitHub Releases page instead of in a CHANGELOG.md.
      - name: Release (semantic-release)
        run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `|| true` on both captures is required, not defensive noise: on a repo
      # with no tags `git describe` exits 128, and Actions runs `run:` steps
      # under `bash -e`, so the FIRST release would die on its own guard.
      - name: Detect whether a release happened
        id: detect
        run: |
          after="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          before="${{ steps.before.outputs.tag }}"
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "released $after"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no release (tag unchanged: ${before:-none})"
          fi

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Kept for the protection rule and the deployment audit trail. It no longer
    # carries any secret: GHCR authenticates with the workflow's own token.
    environment: release
    permissions:
      contents: read
      # Push to ghcr.io. Not granted by default.
      packages: write
      # OIDC for keyless cosign. Never granted by default, and its absence is
      # only discovered after the tag has already been cut.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mailkube/smtp-relay
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3

      # Sign the immutable digest once rather than each mutable tag: the tags
      # all point at this digest, and `latest` will move.
      - name: Sign the image digest
        run: cosign sign --yes "ghcr.io/mailkube/smtp-relay@${{ steps.build.outputs.digest }}"

      # There is deliberately no description-sync step. GHCR renders the linked
      # repository's README.md on the package page, and the link comes from the
      # org.opencontainers.image.source label baked into the Dockerfile. Nothing
      # is pushed, so nothing can drift. See .rules/RELEASE.md.
