# =============================================================================
#  00-secret.yaml
#  The SMTP credential for ghcr.io/mailkube/smtp-relay.
# =============================================================================
#
#  This is the only place the credential exists in the cluster. Application pods
#  never receive it: they speak plain, unauthenticated SMTP to the relay, and
#  the relay holds the secret.
#
#  SMTP_USERNAME must be <username>@<your-verified-domain>. A bare username does
#  NOT authenticate: the upstream splits the AUTH identity on '@' and answers
#  anything else with 535.
#
#  SMTP_PASSWORD is the SMTP credential's SECRET, not an API key. An mk_... API
#  key will not authenticate here. Create an SMTP credential at
#  https://app.mailkube.com/domain/credentials#smtp
#
#  -------------------------------------------------------------------------
#  WARNING about creating this from a file:
#
#      echo 'the-secret' > password.txt          # WRONG: appends a newline
#      printf '%s' 'the-secret' > password.txt   # correct
#      kubectl create secret generic mailkube-smtp-credential \
#          --from-file=password=password.txt
#
#  `echo` embeds a trailing newline in the file, and kubectl base64-encodes the
#  file byte for byte, newline included. This relay strips trailing whitespace
#  when it reads a *_FILE value, so it survives that mistake. Most other tools
#  in this ecosystem do not, and the resulting 535 is indistinguishable from a
#  typo. Get into the habit of `printf '%s'`.
#
#  The same applies to `--from-literal` inside shell pipelines and to any
#  templating that adds a trailing newline to a rendered value.
#  -------------------------------------------------------------------------
#
#  In production, prefer a secret manager (External Secrets Operator, Vault
#  agent, Sealed Secrets) over a committed manifest. This file exists to show
#  the shape and the key names the workload manifests expect.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mailkube-smtp-credential
  labels:
    app.kubernetes.io/name: mailkube-smtp-relay
    app.kubernetes.io/component: relay
type: Opaque
# stringData rather than data: values are plain text here and the API server
# base64-encodes them. It removes an entire class of hand-encoding mistakes.
stringData:
  # MUST be <username>@<verified-domain>.
  username: myapp01@example.com
  # The SMTP credential secret. Not an API key.
  password: change-me
